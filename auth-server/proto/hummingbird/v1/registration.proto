syntax = "proto3";

option go_package = "github.com/scionproto/scion/hummingbird/auth-server/gen/hummingbird/v1;hummingbird";

package proto.hummingbird.v1;

import "crypto/v1/signed.proto";

// Internal shim → auth-server API. Mirrors the public AccountService in
// account.proto; the only structural difference is that CreateChallengeRequest
// carries the sui_address that the shim injects from its own keystore.
//
// Message types below are prefixed "Shim" to match the vendored copy of this
// file at shim/proto/hummingbird/v1/registration.proto, where the prefix is
// required to avoid a name collision with account.proto during TS codegen.
// Keep both copies' field definitions in sync when updating either one.
service ASRegistrationService {
    rpc CreateChallenge(ShimCreateChallengeRequest) returns (ShimCreateChallengeResponse) {}
    rpc RegisterAS(ShimRegisterASRequest) returns (ShimRegisterASResponse) {}
}

message ShimCreateChallengeRequest {
    // ISD-AS identifier of the registering AS.
    uint64 ia = 1;
    // Sui address that will receive the AsAuthCap on success.
    // Injected by the shim from its own keystore; included in the signed
    // payload so the AS explicitly authorises the transfer to this address.
    string sui_address = 2;
}

// Flat challenge — mirrors account.proto CreateChallengeResponse.
message ShimCreateChallengeResponse {
    string id = 1;
    bytes value = 2;
}

// Mirrors account.proto RegisterASRequest, plus the HTTP authority the AS used
// when signing (needed to reproduce the associated-data for ECDSA verification).
message ShimRegisterASRequest {
    string id = 1;
    proto.crypto.v1.SignedMessage signed_challenge = 2;
    // HTTP :authority header from the original AS → shim connection.
    // Included in the ECDSA signature as associated data.
    string authority = 3;
}

// Mirrors account.proto RegisterASResponse exactly.
message ShimRegisterASResponse {
    string auth_cap_id = 1;
    uint64 isd_as_id = 2;
}
